name: validate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: step-over-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: step-over-frontend/package-lock.json

      - run: npm ci

      - run: npm run lint
